name: CI

on:
  push:
    branches: [main, develop, production-hardening]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Nightly security scans

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Node & Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ai-django/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r services/ai-django/requirements.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test (Node & Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trifusion
          POSTGRES_PASSWORD: trifusion
          POSTGRES_DB: trifusion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trifusion -d trifusion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://trifusion:trifusion@localhost:5432/trifusion_test
      DIRECT_URL: postgresql://trifusion:trifusion@localhost:5432/trifusion_test
      DATABASE_URL_TEST: postgresql://trifusion:trifusion@localhost:5432/trifusion_test
      DIRECT_URL_TEST: postgresql://trifusion:trifusion@localhost:5432/trifusion_test
      AUTH_SECRET: ci-test-secret-key-at-least-16-chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ai-django/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r services/ai-django/requirements.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma test schema
        run: pnpm --filter @trifusion/database migrate:deploy

      - name: Run test suite
        run: pnpm test

      - name: Run Django test suite explicitly
        run: python services/ai-django/manage.py test ai_gateway --verbosity 2

  build:
    name: Build (All Workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ai-django/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r services/ai-django/requirements.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify Django configuration
        run: python services/ai-django/manage.py check

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SAST - CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Secret Scanning - TruffleHog
      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.before || 'HEAD~1' }}
          fail: true

      # Node dependency audit
      - name: Setup pnpm for audit
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js for audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --prod || true

      # Python dependency audit
      - name: Setup Python for audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r services/ai-django/requirements.txt || true
