[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ai_service.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ai_service"]

